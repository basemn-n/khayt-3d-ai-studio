name: Khayt quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r khayt-ai-server/requirements.txt
      - name: Compile backend
        run: python -m py_compile khayt-ai-server/main.py
      - name: Run geometry and DST regression tests
        run: python -m unittest discover -s khayt-ai-server/tests -v
      - name: Extract and validate browser JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          start = html.rfind("<script>")
          end = html.find("</script>", start)
          if start < 0 or end < 0:
              raise SystemExit("Could not locate the application script")
          Path("/tmp/khayt-inline.js").write_text(html[start + 8:end], encoding="utf-8")
          PY
          node --check /tmp/khayt-inline.js
