services:
  - type: web
    name: khayt-3d-ai
    runtime: python
    plan: free
    rootDir: khayt-ai-server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1
      - key: OPENAI_TRANSCRIBE_MODEL
        value: gpt-4o-mini-transcribe
