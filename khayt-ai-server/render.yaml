services:
  - type: web
    name: khayt-3d-ai
    runtime: python
    plan: free
    rootDir: khayt-ai-server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: AI_PROVIDER
        value: cloudflare
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_TEXT_MODEL
        value: "@cf/meta/llama-3.1-8b-instruct-fp8-fast"
      - key: CLOUDFLARE_AUDIO_MODEL
        value: "@cf/openai/whisper"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1
      - key: OPENAI_TRANSCRIBE_MODEL
        value: gpt-4o-mini-transcribe
